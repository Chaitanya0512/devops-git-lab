name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run linting
        run: ruff check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build application
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: calculator-package
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: calculator-package
          path: deployment/

      - name: Verify artifact
        run: |
          echo "Files received for deployment:"
          ls -lh deployment/

      - name: Deploy application
        env:
          DEPLOYMENT_TOKEN: ${( secrets.DEPLOYMENT_TOKEN )}
        run: |
          echo "Deployment token received."
          echo "Deploying calculator application..."

  deploy-production:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: calculator-package
          path: deployment/

      - name: Verify artifact
        run: |
          echo "Files received for production:"
          ls -lh deployment/

      - name: Deploy application
        run: echo "Deploying calculator application to production..."
